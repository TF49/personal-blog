name: Update Articles from GitHub Issues

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:
  repository_dispatch:
    types: [update-articles]

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate articles (GitHub Issues)
        env:
          BLOG_CONTENT_REPO: TF49/blog-content
          BLOG_ARTICLE_LABEL: blog
          BLOG_CONTENT_TOKEN: ${{ secrets.BLOG_CONTENT_TOKEN }}
        run: npm run generate:articles

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet public/articles.json; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check-changes.outputs.no_changes == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/articles.json
          git commit -m "Update articles from GitHub Issues"
          git push
